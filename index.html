<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Avega Lite Visualization</title>
  <!-- Avega Lite + Vega embed via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f7f7;
      color: #222;
    }
    header {
      padding: 1rem 2rem;
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
    }
    main {
      padding: 2rem;
      display: flex;
      justify-content: center;
    }
    #vis {
      width: 100%;
      max-width: 900px;
      height: 500px;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Avega Lite Visualization</h1>
  </header>
  <main>
    <div id="vis"></div>
  </main>

  <script type="text/javascript">
    // Load the Avega Lite spec from a separate JSON file
    fetch("spec.json")
      .then(response => response.json())
      .then(spec => {
        vegaEmbed("#vis", spec, { actions: false, theme: "default" })
          .then(() => console.log("Avega Lite chart rendered."))
          .catch(err => console.error("Avega Lite render error:", err));
      })
      .catch(err => console.error("Failed to load vis.json:", err));
  </script>
</body>
</html>
